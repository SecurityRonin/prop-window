# A signed, annotated `v[0-9]*` tag builds the Electron app for macOS/Windows/Linux
# and attaches the installers to a GitHub Release.
#
# macOS signing + notarization (the timeglyph model) is GATED on the MACOS_*
# secrets: the app ships UNSIGNED until they exist, then the next release
# Developer-ID-signs + notarizes + staples the .app automatically. See
# docs/macos-signing.md.
#
# Windows Authenticode signing (also the timeglyph model) is via Azure Trusted
# Signing under "Security Ronin Ltd", keyless through GitHub OIDC — no cert file,
# no client secret. The AZURE_* org secrets are visibility=all and the fleet
# federated credential wildcards repo:SecurityRonin/*:environment:release, so the
# only per-repo requirement is the `release` environment (set on the build job).
#
# Distribution fan-out (Homebrew Cask / apt-Cloudsmith / winget) is wired below
# but DORMANT until these prerequisites exist — each is gated by a secret and an
# external feed/repo that must be created FIRST:
#   - secrets.TAP_GITHUB_TOKEN   + SecurityRonin/homebrew-tap with a
#                                  Casks/prop-window.rb and an `update-prop-window`
#                                  repository_dispatch handler.
#   - secrets.CLOUDSMITH_API_KEY + a Cloudsmith repo `securityronin/prop-window`
#                                  (must be created or the push 404s).
#   - secrets.WINGET_TOKEN       + the package bootstrapped in winget-pkgs
#                                  (first submission is a manual PR) and a
#                                  `securityronin-bot` fork.
# The homebrew/winget/cloudsmith steps are `continue-on-error` so a release never
# fails on a not-yet-provisioned channel.
name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

# Presence flags: signing paths run only once the relevant secrets exist, so a
# release stays green before signing is provisioned.
#   HAS_MACOS_SIGNING   → Apple Developer ID cert (see docs/macos-signing.md)
#   HAS_WINDOWS_SIGNING → Azure Trusted Signing (AZURE_* org secrets, visibility=all)
env:
  HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
  HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}

jobs:
  build:
    # 'release' environment → the GitHub OIDC token's subject becomes
    # repo:SecurityRonin/prop-window:environment:release, which the fleet Azure
    # federated credential matches (claims['sub'] matches
    # 'repo:SecurityRonin/*:environment:release'). id-token:write lets the Windows
    # leg mint that token so azure/login can trade it for the signing session.
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Prepare macOS notary key
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        run: echo "${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}" | base64 -d > "$RUNNER_TEMP/notary.p8"

      - name: Build installers
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$HAS_MACOS_SIGNING" != "true" ]; then
            # No signing secrets yet → build unsigned, skip notarization cleanly.
            npx electron-builder --mac --publish never -c.mac.notarize=false -c.mac.identity=null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac --publish never
          else
            npx electron-builder --publish never
          fi

      # OIDC login to Azure FIRST: the trusted-signing-action rides the session
      # this establishes (it does not do the GitHub→Azure token exchange itself).
      - name: Azure login (OIDC)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Authenticode-sign the NSIS installer (verified publisher Security Ronin
      # Ltd) so the downloaded prop-window.Setup.<ver>.exe clears SmartScreen's
      # unknown-publisher block. Values + gotchas: ronin-issen §"Windows code
      # signing". (The app's inner exe is packed by electron-builder and stays
      # unsigned; the installer is the SmartScreen-gated artifact.)
      - name: Sign Windows installer (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        uses: azure/trusted-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: https://neu.codesigning.azure.net
          trusted-signing-account-name: securityronin
          certificate-profile-name: securityronin-public
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: 'dist-*'
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/checksums.txt
          generate_release_notes: true

      # Homebrew Cask: notify the tap to refresh Casks/prop-window.rb for this
      # version. GUI app → Cask (installs the .dmg to /Applications), not a Formula.
      # The .dmg must be notarized or Gatekeeper blocks it on install.
      - name: Dispatch to homebrew tap
        continue-on-error: true
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: SecurityRonin/homebrew-tap
          event-type: update-prop-window
          client-payload: '{"version": "${{ github.ref_name }}"}'

  # winget: update the package with the new Windows NSIS .exe installer.
  # vedantmgoyal9/winget-releaser CANNOT create a new package — it only bumps an
  # existing one. The first version must be a manual submission to winget-pkgs.
  # continue-on-error keeps a bad winget run from failing the tag.
  winget:
    needs: release
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: SecurityRonin.prop-window
          fork-user: securityronin-bot
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  # apt: push the .deb from the Linux build to a Cloudsmith apt repo so users can
  # `apt install prop-window` after adding the repo. Gated on CLOUDSMITH_API_KEY.
  cloudsmith:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: 'dist-ubuntu-*'
          path: debs
          merge-multiple: true

      - name: Install Cloudsmith CLI
        run: |
          pip install --user cloudsmith-cli==1.16.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push .deb to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          for deb in debs/*.deb; do
            [ -f "$deb" ] || continue
            cloudsmith push deb securityronin/prop-window/any-distro/any-version "$deb"
          done
