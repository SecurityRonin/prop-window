<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chrome</title>
    <style>
      :root {
        --chrome-bg: #dee1e6;
        --toolbar-bg: #fff;
        --tab-active: #fff;
        --omnibox-bg: #f1f3f4;
        --omnibox-focus: #fff;
        --ink: #202124;
        --dim: #5f6368;
        --hair: #c9ccd1;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--chrome-bg);
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          'Helvetica Neue',
          Arial,
          'PingFang HK',
          'Microsoft JhengHei',
          sans-serif;
        user-select: none;
        cursor: default;
      }
      .tabstrip,
      .toolbar {
        -webkit-app-region: drag;
      }
      .tab,
      .newtab,
      .wc,
      .navbtn,
      .omnibox,
      .ext,
      .avatar {
        -webkit-app-region: no-drag;
      }

      .tabstrip {
        background: var(--chrome-bg);
        display: flex;
        align-items: flex-end;
        height: 40px;
        padding: 6px 8px 0;
        gap: 2px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 12px;
        min-width: 200px;
        max-width: 280px;
        background: var(--tab-active);
        border-radius: 10px 10px 0 0;
        font-size: 12.5px;
        color: var(--ink);
      }
      .tab .fav {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex: 0 0 16px;
      }
      .tab .fav img {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }
      .tab .ttl {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .tab .x {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        flex: 0 0 16px;
      }
      .tab .x:hover {
        background: #d5d7db;
      }
      .newtab {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        margin-left: 2px;
      }
      .wincontrols {
        margin-left: auto;
        display: flex;
        height: 34px;
      }
      .wincontrols .wc {
        width: 44px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
      }
      .wincontrols .wc:hover {
        background: #d5d7db;
      }
      .wincontrols .wc.close:hover {
        background: #e81123;
        color: #fff;
      }

      .toolbar {
        background: var(--toolbar-bg);
        display: flex;
        align-items: center;
        gap: 6px;
        height: 44px;
        padding: 0 10px;
        border-bottom: 1px solid var(--hair);
      }
      .navbtn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        flex: 0 0 30px;
      }
      .navbtn.disabled {
        color: #bdc1c6;
        pointer-events: none;
      }
      .navbtn:hover:not(.disabled) {
        background: #f1f3f4;
      }
      .omnibox {
        flex: 1;
        height: 32px;
        background: var(--omnibox-bg);
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 14px;
        min-width: 0;
        cursor: text;
      }
      .omnibox:focus-within {
        background: var(--omnibox-focus);
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      }
      .lock {
        flex: 0 0 16px;
        display: flex;
        align-items: center;
        color: var(--dim);
      }
      .urltext {
        flex: 1;
        font-size: 13.5px;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        outline: none;
        min-width: 0;
        user-select: text;
        cursor: text;
      }
      .urltext .scheme {
        color: var(--dim);
      }
      .urltext.notsecure .scheme {
        color: #c5221f;
      }
      .star {
        flex: 0 0 16px;
        color: var(--dim);
        display: flex;
        align-items: center;
      }
      .ext {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        flex: 0 0 30px;
      }
      .ext:hover {
        background: #f1f3f4;
      }
      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #7c3aed;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        flex: 0 0 26px;
        margin: 0 2px;
      }
    </style>
  </head>
  <body>
    <div class="tabstrip">
      <div class="tab">
        <span class="fav" id="fav">🌐</span>
        <span class="ttl" id="tabttl">New Tab</span>
        <span class="x"
          ><svg width="10" height="10" viewBox="0 0 10 10">
            <path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.3" fill="none" /></svg
        ></span>
      </div>
      <div class="newtab">
        <svg width="14" height="14" viewBox="0 0 14 14">
          <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.4" />
        </svg>
      </div>
      <div class="wincontrols">
        <div class="wc" id="wc-min">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <path d="M0 5h10" stroke="currentColor" stroke-width="1.2" />
          </svg>
        </div>
        <div class="wc" id="wc-max">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <rect
              x="1"
              y="1"
              width="8"
              height="8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
            />
          </svg>
        </div>
        <div class="wc close" id="wc-close">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.2" />
          </svg>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="navbtn" id="back" title="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path
            d="M15 5l-7 7 7 7"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="navbtn disabled" id="forward" title="Forward">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path
            d="M9 5l7 7-7 7"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="navbtn" id="reload" title="Reload">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path
            d="M20 11a8 8 0 10-1.6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M20 5v6h-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <div class="omnibox" id="omnibox">
        <span class="lock" id="lock"
          ><svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <rect
              x="5"
              y="11"
              width="14"
              height="9"
              rx="2"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8" /></svg
        ></span>
        <span class="urltext" id="urltext" contenteditable="true" spellcheck="false"></span>
        <span class="star"
          ><svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 4l2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4-3.9 5.6-.8z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            /></svg
        ></span>
      </div>

      <div class="ext" title="Extensions">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M20.5 11H19V7a2 2 0 00-2-2h-4V3.5a2.5 2.5 0 00-5 0V5H4a1 1 0 00-1 1v3.8h1.5a2.2 2.2 0 010 4.4H3V18a2 2 0 002 2h3.8v-1.5a2.2 2.2 0 014.4 0V20H17a2 2 0 002-2v-4h1.5a2.5 2.5 0 000-5z"
          />
        </svg>
      </div>
      <div class="avatar" title="Profile">P</div>
      <div class="navbtn" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.7" />
          <circle cx="12" cy="12" r="1.7" />
          <circle cx="12" cy="19" r="1.7" />
        </svg>
      </div>
    </div>

    <script>
      // Pure helpers come from the preload bridge (window.propURL) — the SAME code the
      // unit tests cover. This script is glue only.
      const $ = (s) => document.querySelector(s);
      const U = window.propURL;
      let secure = true;

      function renderUrl(u) {
        const el = $('#urltext');
        const { scheme, rest } = U.splitScheme(u);
        el.innerHTML = scheme
          ? '<span class="scheme">' + U.escapeHtml(scheme) + '</span>' + U.escapeHtml(rest)
          : U.escapeHtml(rest);
        el.classList.toggle('notsecure', !secure);
      }

      window.prop.onConfig((c) => {
        secure = c.secure;
        $('#tabttl').textContent = c.title;
        document.title = c.title;
        const fav = $('#fav');
        if (U.isImageFavicon(c.favicon))
          fav.innerHTML = '<img src="' + U.escapeHtml(c.favicon) + '">';
        else fav.textContent = c.favicon;
        renderUrl(c.display);
        if (!secure) {
          $('#lock').innerHTML =
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none">' +
            '<path d="M12 3l9 16H3z" stroke="#c5221f" stroke-width="1.7" stroke-linejoin="round"/>' +
            '<path d="M12 9v4M12 16v.5" stroke="#c5221f" stroke-width="1.7" stroke-linecap="round"/></svg>';
        }
      });

      window.prop.onNavState((s) => {
        $('#back').classList.toggle('disabled', !s.canBack);
        $('#forward').classList.toggle('disabled', !s.canForward);
      });

      $('#back').onclick = () => window.prop.nav('back');
      $('#forward').onclick = () => window.prop.nav('forward');
      $('#reload').onclick = () => window.prop.nav('reload');
      $('#wc-min').onclick = () => window.prop.win('min');
      $('#wc-max').onclick = () => window.prop.win('max');
      $('#wc-close').onclick = () => window.prop.win('close');

      // Address bar: Enter navigates to the real site; Shift+Enter spoofs the shown URL.
      const bar = $('#urltext');
      bar.addEventListener('focus', () => {
        bar.textContent = bar.textContent; // flatten styled spans to editable text
      });
      bar.addEventListener('blur', () => renderUrl(bar.textContent.trim()));
      bar.addEventListener('keydown', (e) => {
        const action = U.classifyEnter(e);
        if (!action) return;
        e.preventDefault();
        const raw = bar.textContent.trim();
        if (action === 'navigate') {
          const url = U.normalizeUrl(raw); // add https:// to a bare domain
          if (url) window.prop.nav('go', url);
          renderUrl(url); // show the real URL we navigated to
        } else {
          renderUrl(raw); // spoof: show exactly what was typed, don't navigate
        }
        bar.blur();
      });
    </script>
  </body>
</html>
