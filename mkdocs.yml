site_name: prop-window
site_url: https://securityronin.github.io/prop-window/
repo_url: https://github.com/SecurityRonin/prop-window
repo_name: SecurityRonin/prop-window
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - macOS Signing: macos-signing.md
  - Privacy Policy: privacy.md
  - Terms of Service: terms.md

plugins:
  - search
